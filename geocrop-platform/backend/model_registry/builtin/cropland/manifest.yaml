key: cropland
name: Cropland vs non-cropland (Random Forest)
task: cropland
version: 2026.10.1
status: ready
enabled: true
entrypoint: task:CroplandTask
artifact: cropland.joblib
requires: [imagery]
input_spec:
  bands: [B2, B3, B4, B8, B11, B12, NDVI]
  accepts_band_counts: [6, 7]
  resolution_m: 30
  crs: EPSG:5070
  scaling: Sentinel-2 L2A reflectance x 10000
resources: {queue: models}
outputs:
  - {kind: cropland, group: Cropland, format: cog, dtype: uint8, colormap: cropland_default}
valid_regions: ["Columbia Basin, Washington, USA (AOI 1)"]
training:
  data: USDA CDL + Sentinel-2 composite, AOI 1
  split: random 80/20 pixel split (optimistic, spatial leakage likely)
  metrics_file: aoi1_cropland.metrics.json
