proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:50m max_size=2g inactive=30d use_temp_path=off;

server {
  listen 80;

  # Resolve service names at request time through Docker's DNS, so rebuilding
  # the api or tiles container (new IP) never breaks the site.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  set $tiles_upstream http://tiles:8001;
  client_max_body_size 600m;
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # React single-page app
  root /usr/share/nginx/html;
  # The page shell must never be cached, so a new build is picked up on the next load.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }

  # Built assets have content hashes in their names, so they can be cached for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # MapLibre's web worker is an ES module (.mjs); browsers require a JavaScript MIME type.
  location ~* \.mjs$ {
    types { application/javascript mjs; }
    expires 1y;
  }

  # FastAPI
  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  # Raster tiles: versioned URLs, so cache hard
  location /tiles/ {
    proxy_pass $tiles_upstream;
    proxy_cache tiles;
    proxy_cache_valid 200 204 30d;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status always;
  }
}
